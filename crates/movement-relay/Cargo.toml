[package]
name = "movement-relay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env"] }
common = { workspace = true, features = ["default", "redis"] }
ds-runtime = { workspace = true, features = ["default", "redis"] }
dotenvy = "0.15.7"
health-http = { workspace = true }
metrics = "0.24"
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl", "sasl"] }
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing = "0.1.44"
trust-schema = { workspace = true }

[dev-dependencies]
# The Kafka metrics' unit tests read a local recorder.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util", "net", "io-util"] }

[lints]
workspace = true
