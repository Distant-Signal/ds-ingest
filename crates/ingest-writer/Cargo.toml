[package]
name = "ingest-writer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# A library target as well as the binary, so its tests reach the config and
# the loop registration. The loop runner itself is `ds_store::loops` (plan
# 1B.7: the api's loops take the same locks the same way). Nothing depends
# on this crate.
[lib]
path = "src/lib.rs"

[[bin]]
name = "ingest-writer"
path = "src/main.rs"

# One-off ingest data repairs moved out of the api image (phase 5 prep, Q2).
[[bin]]
name = "writer-maintenance"
path = "src/bin/writer_maintenance.rs"

# Every dependency but tikv-jemallocator is already in the workspace and
# Cargo.lock, at the versions and features its other users take.
[dependencies]
anyhow = "1.0.102"
# The reconciliation sweep's grace period (`chrono::Duration`).
chrono = "0.4.44"
# Dublin's date, for the Irish board history's retention cutoff.
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive", "env"] }
# `redis`: the bounded Redis connection and the ACL-user URL for the stream
# consumers (plan 3a.3).
common = { workspace = true, features = ["default", "postgres", "redis"] }
# The line catalogue, embedded (`--lines-dir` defaults to it).
ds-lines = { workspace = true }
ds-runtime = { workspace = true, features = ["default", "postgres", "redis"] }
# The schema gate (`ds_store::schema::wait_for_schema`, plan 1B.2), the
# loop runner and the train-domain loops (`ds_store::loops`).
ds-store = { workspace = true }
health-http = { workspace = true }
# The stream consumer runtime (plan 3a.3's Redis half, spec §7.7).
ingest-stream = { workspace = true }
# The writer's own gauges (`telemetry`: ingest_freshness).
metrics = "0.24"
redis ={ version = "1.8", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.228", features = ["derive"] }
# The global allocator (`main.rs`, DS-390): glibc malloc kept every large
# one-off load (the CORPUS comparison) in a thread arena it never gave
# back; jemalloc, with its background purge thread, returns it.
tikv-jemallocator = "0.6.1"
# `raw_value`: the payload of rejected rows for the dead-letter stream.
serde_json = { version = "1.0.149", features = ["raw_value"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1.44"

[dev-dependencies]
# `test_support::DB_GRANTS_YAML`: freshness_rls checks the row policies.
ds-store = { workspace = true, features = ["test-support"] }
# The clamp counter's and the gauges' unit tests read a local recorder.
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[lints]
workspace = true
